[package]
name = "bmap"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "MAP file memory analyzer (Xilem)"
repository = "https://github.com/bmap"

[dependencies]
xilem = { git = "https://github.com/linebender/xilem" }
mapfile_parser = { version = "2.12", features = ["serde"] }
rfd = "0.17"
sys-locale = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
