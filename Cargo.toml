[package]
name = "bmap"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MAP file memory analyzer"
repository = "https://github.com/bmap"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", default-features = false, features = ["x11", "wayland"] }
anyhow = "1.0"
mapfile_parser = { version = "2.12", features = ["serde"] }
rfd = "0.17"
tokio = { version = "1", features = ["fs", "rt-multi-thread"] }
sys-locale = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
